# ============================================================
# Bugzilla RAG — Docker Compose stack
#
# Two modes depending on your Ollama setup:
#
# ── Mode A: Ollama already installed as a system service ──────
#   (common on openSUSE: sudo zypper install ollama)
#   The app container uses host networking to reach localhost:11434.
#
#     cp .env.example .env          # no changes needed
#     docker compose build
#     docker compose up -d app-host
#     # open http://localhost:5000
#
# ── Mode B: Ollama managed by Docker Compose (sidecar) ────────
#   Use this when Ollama is NOT installed on the host.
#
#     cp .env.example .env          # no changes needed
#     docker compose build
#     docker compose --profile ollama up -d
#     docker compose exec ollama ollama pull qwen3-coder:30b
#     # open http://localhost:5000
#
# ── Receiving the ChromaDB index (both modes) ─────────────────
#   Before starting the app, rsync the index from the data owner:
#
#     rsync -avz --progress \
#       <owner>@<owner-host>:/path/to/chroma_db/ \
#       ./chroma_db/
#
# ── Re-indexing from scratch (optional, ~15 hours) ────────────
#   Place bug_reports.jsonl next to this file, then set:
#     BUGZILLA_JSONL_HOST_PATH=./bug_reports.jsonl
#   before running either mode above.
# ============================================================

services:

  # ── Mode A: app with host networking ─────────────────────────
  # Use when Ollama runs as a system service on the host.
  # Reaches Ollama at http://localhost:11434 (same as bare-metal).
  app-host:
    build:
      context: .
      dockerfile: Dockerfile
    image: bugzilla-rag:latest
    container_name: bugzilla-app
    restart: unless-stopped
    network_mode: host
    volumes:
      - ${CHROMA_DB_HOST_PATH:-./chroma_db}:/data/chroma_db
      - ${BUGZILLA_JSONL_HOST_PATH:-/dev/null}:/data/bug_reports.jsonl:ro
    environment:
      CHROMA_DIR:         /data/chroma_db
      BUGZILLA_JSONL:     /data/bug_reports.jsonl
      OLLAMA_BASE_URL:    http://localhost:11434
      OLLAMA_MODEL:       ${OLLAMA_MODEL:-qwen3-coder:30b}
      OLLAMA_TEMPERATURE: ${OLLAMA_TEMPERATURE:-0.1}
      EMBEDDING_MODEL:    ${EMBEDDING_MODEL:-sentence-transformers/all-MiniLM-L6-v2}
      RAG_TOP_K:          ${RAG_TOP_K:-3}
      INDEX_BATCH_SIZE:   ${INDEX_BATCH_SIZE:-200}
      BUGZILLA_BASE_URL:  ${BUGZILLA_BASE_URL:-https://bugzilla.suse.com/rest/bug}
    env_file:
      - path: .env
        required: false
    healthcheck:
      test: ["CMD", "curl", "-sf", "http://localhost:5000/status"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 60s

  # ── Mode B: Ollama sidecar ────────────────────────────────────
  # Use when Ollama is NOT installed on the host.
  # Start with:  docker compose --profile ollama up -d
  ollama:
    profiles: [ollama]
    image: ollama/ollama:latest
    container_name: bugzilla-ollama
    restart: unless-stopped
    volumes:
      - ollama-models:/root/.ollama
    ports:
      - "11434:11434"
    # GPU support (NVIDIA): uncomment and install NVIDIA Container Toolkit.
    # deploy:
    #   resources:
    #     reservations:
    #       devices:
    #         - driver: nvidia
    #           count: all
    #           capabilities: [gpu]
    healthcheck:
      test: ["CMD", "curl", "-sf", "http://localhost:11434/"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 30s

  # ── Mode B: app with bridge networking (sidecar Ollama) ───────
  app:
    profiles: [ollama]
    build:
      context: .
      dockerfile: Dockerfile
    image: bugzilla-rag:latest
    container_name: bugzilla-app-sidecar
    restart: unless-stopped
    depends_on:
      ollama:
        condition: service_healthy
    ports:
      - "5000:5000"
    volumes:
      - ${CHROMA_DB_HOST_PATH:-./chroma_db}:/data/chroma_db
      - ${BUGZILLA_JSONL_HOST_PATH:-/dev/null}:/data/bug_reports.jsonl:ro
    environment:
      CHROMA_DIR:         /data/chroma_db
      BUGZILLA_JSONL:     /data/bug_reports.jsonl
      OLLAMA_BASE_URL:    http://ollama:11434
      OLLAMA_MODEL:       ${OLLAMA_MODEL:-qwen3-coder:30b}
      OLLAMA_TEMPERATURE: ${OLLAMA_TEMPERATURE:-0.1}
      EMBEDDING_MODEL:    ${EMBEDDING_MODEL:-sentence-transformers/all-MiniLM-L6-v2}
      RAG_TOP_K:          ${RAG_TOP_K:-3}
      INDEX_BATCH_SIZE:   ${INDEX_BATCH_SIZE:-200}
      BUGZILLA_BASE_URL:  ${BUGZILLA_BASE_URL:-https://bugzilla.suse.com/rest/bug}
    env_file:
      - path: .env
        required: false
    healthcheck:
      test: ["CMD", "curl", "-sf", "http://localhost:5000/status"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 60s

volumes:
  ollama-models:
