# ============================================================
# Bugzilla RAG — Docker Compose stack
#
# Services:
#   ollama  — local LLM runtime (CPU-only by default)
#   app     — Flask RAG web interface
#
# ── Normal setup for a new teammate ──────────────────────────
#
#   1. Clone the repo and enter the directory.
#
#   2. Copy the example config:
#        cp .env.example .env
#      No edits needed for basic use. Do NOT set OLLAMA_BASE_URL
#      — the default (http://ollama:11434) is correct inside Docker.
#
#   3. Build the app image:
#        docker compose build
#
#   4. Start Ollama and pull the LLM model (~18 GB, one-time):
#        docker compose up -d ollama
#        docker compose exec ollama ollama pull qwen3-coder:30b
#
#   5. Contact the data owner to rsync the ChromaDB index:
#        rsync -avz --progress \
#          <owner>@<owner-host>:/home/balogh/download-bugzilla/chroma_db/ \
#          ./chroma_db/
#      (46 GB — takes 10–60 min depending on network speed)
#
#   6. Start the app:
#        docker compose up -d app
#        docker compose logs -f app
#
#   7. Open http://localhost:5000
#
# ── To re-index from the raw JSONL (optional, ~15 hours) ─────
#
#   Obtain bug_reports.jsonl from the data owner, place it next
#   to this file, then:
#        BUGZILLA_JSONL_HOST_PATH=./bug_reports.jsonl docker compose up app
#   The entrypoint will detect the empty chroma_db/ and start indexing.
# ============================================================

services:

  # ── Ollama: local LLM runtime ──────────────────────────────
  ollama:
    image: ollama/ollama:latest
    container_name: bugzilla-ollama
    restart: unless-stopped
    volumes:
      # Model weights (~18 GB for qwen3-coder:30b) persisted across restarts.
      - ollama-models:/root/.ollama
    ports:
      - "11434:11434"
    # GPU support (NVIDIA): uncomment and install NVIDIA Container Toolkit.
    # deploy:
    #   resources:
    #     reservations:
    #       devices:
    #         - driver: nvidia
    #           count: all
    #           capabilities: [gpu]
    healthcheck:
      test: ["CMD", "curl", "-sf", "http://localhost:11434/"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 30s

  # ── App: Flask RAG web interface ───────────────────────────
  app:
    build:
      context: .
      dockerfile: Dockerfile
    image: bugzilla-rag:latest
    container_name: bugzilla-app
    restart: unless-stopped
    depends_on:
      ollama:
        condition: service_healthy
    ports:
      - "5000:5000"
    volumes:
      # ChromaDB index (46 GB) — rsync from the data owner before starting.
      - ${CHROMA_DB_HOST_PATH:-./chroma_db}:/data/chroma_db

      # Raw JSONL (4 GB) — only needed to re-index from scratch.
      # Leave unset if you received chroma_db/ via rsync.
      - ${BUGZILLA_JSONL_HOST_PATH:-/dev/null}:/data/bug_reports.jsonl:ro
    environment:
      CHROMA_DIR:         /data/chroma_db
      BUGZILLA_JSONL:     /data/bug_reports.jsonl
      OLLAMA_BASE_URL:    http://ollama:11434
      OLLAMA_MODEL:       ${OLLAMA_MODEL:-qwen3-coder:30b}
      OLLAMA_TEMPERATURE: ${OLLAMA_TEMPERATURE:-0.1}
      EMBEDDING_MODEL:    ${EMBEDDING_MODEL:-sentence-transformers/all-MiniLM-L6-v2}
      RAG_TOP_K:          ${RAG_TOP_K:-3}
      INDEX_BATCH_SIZE:   ${INDEX_BATCH_SIZE:-200}
      BUGZILLA_BASE_URL:  ${BUGZILLA_BASE_URL:-https://bugzilla.suse.com/rest/bug}
    env_file:
      - path: .env
        required: false
    healthcheck:
      test: ["CMD", "curl", "-sf", "http://localhost:5000/status"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 60s

volumes:
  ollama-models:
